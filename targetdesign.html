<!doctype html>
<html lang="ko"><head>

<title>타겟팅 디자인 시안</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font:500 12.5px/1.3 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#eceaf6}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.tabs{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:14px;background:rgba(12,11,26,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:auto;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;border-radius:11px;color:#a9a6c4;white-space:nowrap;letter-spacing:.01em}
.tabs button em{font-style:normal;font-size:10.5px;opacity:.6;margin-right:6px;font-variant-numeric:tabular-nums}
.tabs button.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.state{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 54px);transform:translateX(-50%);font-size:13px;letter-spacing:.04em;color:#d9d6ee;white-space:nowrap}
.state[data-k=lock]{color:#ffb4bc}.state[data-k=ten]{color:#ffcf8a}
.bot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;align-items:center;gap:14px;color:#8d8aa8;font-size:11.5px}
.bot button{all:unset;cursor:pointer;pointer-events:auto;padding:6px 12px;border-radius:20px;color:#dcd9f0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
#ld{position:fixed;inset:0;display:grid;place-items:center;color:#bdbad6;background:#05060f;transition:opacity .5s;z-index:9}
#ld i{display:block;width:140px;height:1px;margin-top:12px;background:#22203a}#ld b{display:block;height:100%;width:0;background:#e8cfa0;transition:width .3s}
</style>
<script>
window.__ver = fetch('ver.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(j => {
  const f = location.pathname.split('/').pop() || 'index.html', want = j[f], mine = window.__mine = '11100949';
  if (want && +want > +mine) { location.replace(f + '?v=' + want + '&r=' + Date.now() + location.hash); return new Promise(() => {}); } }).catch(() => {});
</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>

<canvas id="cv"></canvas><div id="ui"></div>
<div id="ld"><div>디자인 시안 불러오는 중<i><b id="lb"></b></i></div></div>
<script type="module">
await window.__ver;
const { start } = await import('./src/proto/tdesign.js?v=11100949');

try { await start(document.getElementById('cv'), p => lb.style.width = (p * 100) + '%'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 600); }
catch (e) { ld.textContent = '오류: ' + e.message; console.error(e); }
</script>
