<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보물 장소 소리 고르기</title>
<meta name="theme-color" content="#04060e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Audiowide&display=swap">
<style>
:root{color-scheme:dark;--g:#b9ff4a;--gr:185,255,74;--ink:#d3d9ea;--mute:#8d96ad;--void:#04060e;--gold:#ffd21f;
  --kr:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;--en:'Audiowide',ui-sans-serif,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink);font-family:var(--kr);-webkit-tap-highlight-color:transparent}
body{padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 110px) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{max-width:880px;margin:0 auto 18px;display:flex;flex-direction:column;gap:4px}
header b{font-family:var(--en);font-size:12px;letter-spacing:.18em;color:rgba(var(--gr),.7)}
header h1{margin:0;font-size:22px;font-weight:500;color:#f2f6ff}
header p{margin:0;font-size:13px;color:var(--mute);line-height:1.6}
main{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.row{border:1px solid rgba(var(--gr),.18);border-radius:14px;padding:12px;background:rgba(10,18,14,.55)}
.row h2{margin:0 0 9px;font-size:14px;font-weight:500;color:#eaf6d8;display:flex;gap:8px;align-items:baseline}
.row h2 span{font-size:11px;color:var(--mute);font-weight:400}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1px solid rgba(var(--gr),.25);border-radius:11px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .15s,border-color .15s}
.opt i{font-style:normal;font-family:var(--en);font-size:11px;color:rgba(var(--gr),.8)}
.opt strong{font-weight:500;font-size:13.5px;color:#f1f7e6}
.opt small{font-size:11.5px;color:var(--mute);line-height:1.45}
.opt.play{background:rgba(var(--gr),.12)}
.opt.on{border-color:var(--gold);background:rgba(255,210,31,.12)}
.opt.on i::after{content:' · 고름';color:var(--gold)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px));background:rgba(4,6,14,.92);border-top:1px solid rgba(var(--gr),.2);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar button{border:1px solid var(--gold);color:#1a1200;background:var(--gold);border-radius:11px;padding:10px 16px;font-weight:600;font-size:13.5px}
.bar button.ghost{background:none;color:var(--gold)}
#pick{font-size:12px;color:var(--mute);max-width:880px;text-align:center;line-height:1.5}
</style>
</head><body>
<header><b>SOUND · TREASURE</b><h1>보물 장소 소리 고르기</h1><p>필요한 소리 다섯 가지 · 세 가지씩. 칸을 누르면 소리가 나고 그 소리가 골라져요. 다 고른 뒤 「고른 소리로 이어 듣기」를 누르면 사슬이 끊기고 상자가 열려 아이템을 줍기까지 실제 순서대로 들려요. 이어폰이나 스피커로 들어 보세요 (좌우 · 울림이 있어요).</p></header>
<main id="list"></main>
<div class="bar"><button id="seq" type="button">고른 소리로 이어 듣기</button><button id="copy" class="ghost" type="button">고른 번호 복사</button><div id="pick"></div></div>
<script type="module">
const { SFX, play } = await import('./src/proto/sfx.js?v=11111459');
const L = ['가', '나', '다'], pick = {}; try { Object.assign(pick, JSON.parse(localStorage.getItem('treasureSfx') || '{}')); } catch (e) {}
const list = document.querySelector('#list'), out = document.querySelector('#pick');
const save = () => { try { localStorage.setItem('treasureSfx', JSON.stringify(pick)); } catch (e) {} out.textContent = SFX.map(s => `${s.name.replace(/ \(.*\)/, '')} ${pick[s.id] != null ? L[pick[s.id]] : '—'}`).join(' · '); };
for (const s of SFX) { const row = document.createElement('section'); row.className = 'row'; row.innerHTML = `<h2>${s.name}<span></span></h2><div class="opts"></div>`;
  s.v.forEach((v, k) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'opt' + (pick[s.id] === k ? ' on' : ''); b.innerHTML = `<i>${L[k]}</i><strong>${v.n}</strong><small>${v.d}</small>`;
    b.onclick = () => { play(s.id, k); pick[s.id] = k; row.querySelectorAll('.opt').forEach(o => o.classList.remove('on')); b.classList.add('on', 'play'); setTimeout(() => b.classList.remove('play'), s.len * 1000); save(); };
    row.querySelector('.opts').append(b); });
  list.append(row); }
save();
/* 실제 순서: 공격 두 번 (사슬 둘) → 쓰러뜨림 (남은 사슬 넷이 차례로) → 빛 터짐 → 아이템 떠올라 날아감 → 내려앉음 → (1층에서 3초 머묾) → 줍기 완료 */
const P = id => pick[id] ?? 0, at = (id, t) => play(id, P(id), t);
document.querySelector('#seq').onclick = () => { at('snap', .2); at('snap', 1.4); for (let i = 0; i < 4; i++) at('snap', 2.7 + i * .16); at('burst', 3.8); at('fly', 5.4); at('land', 7.1); at('pick', 10.4); };
document.querySelector('#copy').onclick = async () => { try { await navigator.clipboard.writeText(out.textContent); document.querySelector('#copy').textContent = '복사했어요'; } catch (e) { const r = document.createRange(); r.selectNodeContents(out); getSelection().removeAllRanges(); getSelection().addRange(r); } };
</script>
</body></html>
