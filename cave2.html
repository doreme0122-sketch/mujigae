<style>

#load .b{width:180px;height:2px;background:rgba(var(--gr),.15);overflow:hidden}

</style>

<canvas id="cv"></canvas>
<div id="ui">
  <div id="head"><b>새 보물 동굴 · 따로 완성한 아래층 맵</b><span>왼쪽 아래 끌어 몰기 · 오른쪽 위 칸 위아래로 쓸어 층 바꾸기(E·Q) · 앞쪽 산맥 밑 동굴로 들어가 골짜기길 끝 공터까지</span></div>
  <div id="fps"></div>
  <div id="where"></div>
  <div id="view"><button id="tog" type="button">설정 접기 ▴</button>
    <div class="cap">기체 스킨</div>

    <div class="cap">카메라</div>
    <div class="row"><label for="ang">각도</label><input id="ang" type="range" min="15" max="90" step="1" value="45"><output id="angv"></output></div>
    <div class="row"><label for="dist">거리</label><input id="dist" type="range" min="12" max="120" step="1" value="25"><output id="distv"></output></div>
  </div>
</div>
<div id="load"><p>산맥과 동굴을 만들고 있어요</p><div class="b"><i></i></div></div>
<div id="rot">기기를 가로로 돌려 주세요</div>
<script type="module">

/* 동굴 끝 보물방에 보물 장소 (사용자 2026-11-11) · 지키는 몬스터 자리: 제단과 기둥 사이를 도는 붉은 표적 (몬스터는 따로 받음) */

{ const P = CAVE.gorge.pts, L = [0]; for (let k = 1; k < P.length; k++) L.push(L[k - 1] + Math.hypot(P[k][0] - P[k - 1][0], P[k][1] - P[k - 1][1]));

  CAVE.gorge.falls = CAVE.gorge.falls.filter(([t, sd]) => { const [a, b] = at(t), fx = b[0] - a[0], fz = b[1] - a[1], l = Math.hypot(fx, fz), sx = -fz / l * sd, sz = fx / l * sd, wx = (a[0] + b[0]) / 2 + sx * (CAVE.gorge.w + 1.5), wz = (a[1] + b[1]) / 2 + sz * (CAVE.gorge.w + 1.5);
    for (let d = .5; d < 19; d += .5) if (inside(wx, wz - d)) return false; return true; }); }
let TS = null; const extra = ({ THREE, isle, camera }) => { const MAPC = window.__MAP = buildCaveMap(THREE, isle); TS = window.__TS = buildTreasure(isle, CAVE.site[0], CAVE.site[1], 'meadow', { camera, grade: 'bronze' });
  /* 보물 장소도 같은 시야를 따름 (산맥 너머로 비치지 않게) */
  const vis = st => { let v = 0; for (let k = 0; k < 9; k++) { const a = k * .785, d = k ? 13 : 0; v = Math.max(v, st.seen((CAVE.site[0] + Math.cos(a) * d * 2) * .5, (CAVE.site[1] + Math.sin(a) * d * 2) * .5)); } return v > .04; };
  return { update: (t, dt, st) => { MAPC && MAPC.update(); if (window.__shotCam) { const c = window.__shotCam; camera.position.set(...c.p); camera.lookAt(...c.t); camera.updateMatrixWorld(); } const on = st.cave ? true : vis(st); if (TS.group.visible !== on) TS.group.visible = on; TS.update(t, dt, st); } }; };
const bar2 = document.createElement('div'); bar2.style.cssText = 'position:fixed;left:50%;bottom:calc(62px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;z-index:5;max-width:92vw';
const btn = (t, f) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.style.cssText = 'font:600 12px/1 system-ui;padding:8px 11px;border-radius:10px;border:1px solid rgba(185,255,74,.45);background:rgba(10,20,14,.7);color:#e8ffd0'; b.onclick = f; bar2.append(b); return b; };
for (const [k, n] of [['wood', '나무'], ['bronze', '청동'], ['silver', '은'], ['gold', '금']]) btn('상자 ' + n, () => TS && TS.setGrade(k));
btn('공격 (체력 −1/6)', () => TS && TS.setHP(TS.hp - 1 / 6)); btn('쓰러뜨림 보기', () => TS && TS.setState('dead')); btn('다시 놓기', () => TS && TS.setState('guard')); document.body.append(bar2);
