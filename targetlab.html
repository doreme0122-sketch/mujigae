<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>타겟팅 시험장</title>
<style>html,body{margin:0;height:100%;background:#120e26;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#ld{position:fixed;inset:0;display:grid;place-items:center;color:#cfd2f2;font:500 14px system-ui,sans-serif;z-index:9;background:#120e26;transition:opacity .5s}#ld i{display:block;width:160px;height:2px;margin-top:10px;background:#2c2850;border-radius:2px;overflow:hidden}#ld b{display:block;height:100%;width:0;background:#ff8a96;transition:width .3s}</style>
<script>
window.__ver = fetch('ver.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(j => {
  const f = location.pathname.split('/').pop() || 'index.html', want = j[f], mine = window.__mine = '11101935';
  if (want && +want > +mine) { location.replace(f + '?v=' + want + '&r=' + Date.now() + location.hash); return new Promise(() => {}); } }).catch(() => {});
</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head><body>
<canvas id="cv"></canvas><div id="ui"></div>
<div id="ld"><div>타겟팅 시험장 불러오는 중<i><b id="lb"></b></i></div></div>
<script type="module">
await window.__ver;
const { start } = await import('./src/proto/tlab.js?v=11101935');
const lb = document.getElementById('lb'), ld = document.getElementById('ld');
try { await start(document.getElementById('cv'), p => lb.style.width = (p * 100) + '%'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 600); }
catch (e) { ld.textContent = '오류: ' + e.message; console.error(e); }
</script>
